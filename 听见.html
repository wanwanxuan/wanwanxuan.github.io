* {
    font-family: "TW-Kai", sans-serif;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: linear-gradient(145deg, #e0eafc 0%, #f0fcff 100%);
    font-family: "LXGW Neo ZhiSong", 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f0fcff;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}
.chat-container {
    width: 100%;
    max-width: 600px;
    height: 100%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 25px 45px rgba(0,0,0,0.1);
    border-radius: 0;
    margin: 0 auto;
    overflow: hidden;  /* 添加这一行 */
}

/* 头部 */
.chat-header {
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(208, 223, 230, 0.4);
}
.settings-icon, .history-icon {
    background: rgba(255, 255, 255, 0);
    backdrop-filter: blur(8px);
    width: 42px;
    height: 42px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    color: #c3d7df;
}
.settings-icon:hover, .history-icon:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(0.96);
}
.char-name {
    font-weight: 600;
    font-size: 18px;
    background: rgba(255, 255, 255, 0);
    backdrop-filter: blur(8px);
    padding: 6px 16px;
    border-radius: 40px;
    letter-spacing: 0.5px;
    color: #d3dbe2;
}

/* 中间圆形动画区 */
.visualizer-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding: 20px;
}

/* 语音波浪容器 */
.orb {
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    position: relative;
}

/* 毛玻璃圆点 */
.wave-dot {
    width: 16px;
    height: 16px;
    background: rgba(211, 225, 239, 0.6);
    backdrop-filter: blur(4px);
    border-radius: 50%;
    transition: all 0.2s ease;
    box-shadow: 0 0 8px rgba(163, 187, 219, 0.4);
}

/* 语音激活时的动画 - 无限循环 */
.orb.playing .wave-dot {
    animation: wavePulse 0.8s ease-in-out infinite alternate;
}

/* 每个圆点不同的延迟，形成波浪效果 */
.orb.playing .wave-dot:nth-child(1) { animation-delay: 0s; animation-duration: 0.6s; }
.orb.playing .wave-dot:nth-child(2) { animation-delay: 0.07s; animation-duration: 0.65s; }
.orb.playing .wave-dot:nth-child(3) { animation-delay: 0.14s; animation-duration: 0.7s; }
.orb.playing .wave-dot:nth-child(4) { animation-delay: 0.21s; animation-duration: 0.75s; }
.orb.playing .wave-dot:nth-child(5) { animation-delay: 0.28s; animation-duration: 0.8s; }
.orb.playing .wave-dot:nth-child(6) { animation-delay: 0.21s; animation-duration: 0.75s; }
.orb.playing .wave-dot:nth-child(7) { animation-delay: 0.14s; animation-duration: 0.7s; }
.orb.playing .wave-dot:nth-child(8) { animation-delay: 0.07s; animation-duration: 0.65s; }
.orb.playing .wave-dot:nth-child(9) { animation-delay: 0s; animation-duration: 0.6s; }

/* 关键帧：放大后缩小，来回往复 */
@keyframes wavePulse {
    0% {
        transform: scale(1);
        background: rgba(138, 171, 204, 0.6);
        box-shadow: 0 0 8px rgba(138, 171, 204, 0.6);
    }
    50% {
        transform: scale(2.2);
        background: rgba(138, 171, 204, 0.6);
        box-shadow: 0 0 20px rgba(138, 171, 204, 0.6);
    }
    100% {
        transform: scale(1);
        background: rgba(138, 171, 204, 0.6);
        box-shadow: 0 0 8px rgba(138, 171, 204, 0.6);
    }
}

/* 静音时的柔和呼吸效果 */
.orb:not(.playing) .wave-dot {
    animation: gentleBreath 3s ease-in-out infinite alternate;
}

@keyframes gentleBreath {
    0% {
        transform: scale(1);
        opacity: 0.4;
    }
    100% {
        transform: scale(1.3);
        opacity: 0.8;
    }
}

/* 圆点大小渐变的群组效果（中间大两边小） */
.wave-dot:nth-child(1) { width: 10px; height: 10px; }
.wave-dot:nth-child(2) { width: 13px; height: 13px; }
.wave-dot:nth-child(3) { width: 17px; height: 17px; }
.wave-dot:nth-child(4) { width: 21px; height: 21px; }
.wave-dot:nth-child(5) { width: 25px; height: 25px; }
.wave-dot:nth-child(6) { width: 21px; height: 21px; }
.wave-dot:nth-child(7) { width: 17px; height: 17px; }
.wave-dot:nth-child(8) { width: 13px; height: 13px; }
.wave-dot:nth-child(9) { width: 10px; height: 10px; }

        });

            let byteArray = new Uint8Array(hex.length/2);
            for(let i=0; i<hex.length; i+=2) byteArray[i/2] = parseInt(hex.substr(i,2),16);
            let mime = ttsConfig.format === 'wav' ? 'audio/wav' : 'audio/mpeg';
            let blob = new Blob([byteArray], { type: mime });
            let url = URL.createObjectURL(blob);
            let audio = new Audio(url);
            currentAudio = audio;
            
            audio.onended = () => { 
                orbElement.classList.remove('playing'); 
                URL.revokeObjectURL(url);

                currentAudio = null;

            audio.onerror = () => {
                orbElement.classList.remove('playing');
                URL.revokeObjectURL(url);
                if(onEnd) onEnd();
                currentAudio = null;
            };
            
            await audio.play();
        } else throw new Error('No audio data');
    } catch (err) { 
        console.error('TTS error', err); 
        orbElement.classList.remove('playing'); 
        if(onEnd) onEnd(); 
    }
}

function cleanTextForTTS(text) {
    // 官方支持的 MiniMax 语气词标签
    const supportedTags = [
        '(laughs)', '(chuckle)', '(coughs)', '(clear-throat)', '(groans)',
        '(breath)', '(pant)', '(inhale)', '(exhale)', '(gasps)', '(sniffs)',
        '(sighs)', '(snorts)', '(burps)', '(lip-smacking)', '(humming)',
        '(hissing)', '(emm)', '(sneezes)'
    ];
    
    let result = text;
    
    // 1. 先把官方标签临时替换成唯一标识符（使用更安全的占位符）
    let tagMap = new Map();
    supportedTags.forEach((tag, idx) => {
        // 使用更独特的占位符，避免冲突
        let placeholder = `{{TAG_${idx}_${Date.now()}}}`;
        tagMap.set(placeholder, tag);
        // 全局替换，忽略大小写
        let regex = new RegExp(escapeRegex(tag), 'gi');
        result = result.replace(regex, placeholder);
    });
    
    // 2. 删除所有剩余的括号及其内容（中英文括号）
    // 匹配中文括号 （...） 和 英文括号 (...) 
    result = result.replace(/[（(][^）)]*[）)]/g, '');
    
    // 3. 恢复官方标签
    for (let [placeholder, originalTag] of tagMap) {
        result = result.replace(new RegExp(escapeRegex(placeholder), 'g'), originalTag);
    }
    
    // 4. 清理多余空格
    result = result.replace(/\s+/g, ' ').trim();
    
    // 5. 调试输出
    console.log("Original:", text);
    console.log("Cleaned:", result);
    
    return result || text;
}

function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

<script>
// 书架数据存储
let bookLibrary = [];  // { id, title, content, progress, timestamp }
let currentBook = null;
let currentPage = 0;
let pageSize = 500;  // 每页字符数
let readerAudio = null;
let isReaderPlaying = false;

// 加载书架数据
function loadBookLibrary() {
    try {
        let saved = localStorage.getItem('book_library');
        if (saved) {
            bookLibrary = JSON.parse(saved);
        }
    } catch(e) { console.warn(e); }
}

// 保存书架数据
function saveBookLibrary() {
    localStorage.setItem('book_library', JSON.stringify(bookLibrary));
}

// 添加书籍
function addBook(title, content) {
    let bookId = Date.now().toString();
    bookLibrary.push({
        id: bookId,
        title: title || '未命名书籍',
        content: content,
        progress: 0,
        timestamp: new Date().toISOString()
    });
    saveBookLibrary();
    renderBookList();
}

// 删除书籍
function deleteBook(bookId) {
    bookLibrary = bookLibrary.filter(b => b.id !== bookId);
    saveBookLibrary();
    renderBookList();
    if (currentBook && currentBook.id === bookId) {
        closeReader();
    }
}

// 渲染书架列表
function renderBookList() {
    let container = document.getElementById('bookListContainer');
    if (!container) return;
    if (bookLibrary.length === 0) {
        container.innerHTML = '<div class="empty-shelf"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><p style="margin-top:12px">暂无书籍，点击导入</p></div>';
        return;
    }
    let html = '<div class="book-list">';
    for (let book of bookLibrary) {
        let totalChars = book.content.length;
        let progressPercent = Math.floor((book.progress / totalChars) * 100);
        html += `
            <div class="book-item" data-id="${book.id}">
                <div class="book-info">
                    <div class="book-title">${escapeHtml(book.title)}</div>
                    <div class="book-meta">${Math.floor(totalChars/1000)}千字 · 进度${progressPercent}%</div>
                </div>
                <div class="book-actions">
                    <div class="book-action-btn" data-action="read" data-id="${book.id}" title="阅读">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    </div>
                    <div class="book-action-btn" data-action="tts" data-id="${book.id}" title="朗读">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                    </div>
                    <div class="book-action-btn" data-action="delete" data-id="${book.id}" title="删除">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                    </div>
                </div>
            </div>
        `;
    }
    html += '</div>';
    container.innerHTML = html;
    
    // 绑定事件
    document.querySelectorAll('.book-action-btn[data-action="read"]').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); openReader(btn.dataset.id); };
    });
    document.querySelectorAll('.book-action-btn[data-action="tts"]').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); ttsBook(btn.dataset.id); };
    });
    document.querySelectorAll('.book-action-btn[data-action="delete"]').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); if(confirm('删除这本书？')) deleteBook(btn.dataset.id); };
    });
}

// 打开阅读器
function openReader(bookId) {
    let book = bookLibrary.find(b => b.id === bookId);
    if (!book) return;
    currentBook = book;
    currentPage = Math.floor(book.progress / pageSize);
    renderReaderPage();
    document.getElementById('readerOverlay').classList.add('active');
}

// 渲染阅读器当前页
function renderReaderPage() {
    if (!currentBook) return;
    let content = currentBook.content;
    let start = currentPage * pageSize;
    let end = Math.min(start + pageSize, content.length);
    let pageText = content.substring(start, end);
    document.getElementById('readerTitle').innerText = currentBook.title;
    document.getElementById('readerPageContent').innerText = pageText;
    document.getElementById('readerPageIndicator').innerText = `${currentPage+1}/${Math.ceil(content.length/pageSize)}`;
}

// 翻页
function readerPrevPage() {
    if (currentPage > 0) {
        currentPage--;
        renderReaderPage();
    }
}
function readerNextPage() {
    let maxPage = Math.ceil(currentBook.content.length / pageSize) - 1;
    if (currentPage < maxPage) {
        currentPage++;
        renderReaderPage();
    }
}

// 保存阅读进度
function saveReaderProgress() {
    if (currentBook) {
        currentBook.progress = currentPage * pageSize;
        saveBookLibrary();
        renderBookList();
    }
}

// 关闭阅读器
function closeReader() {
    saveReaderProgress();
    if (readerAudio) {
        readerAudio.pause();
        readerAudio = null;
        isReaderPlaying = false;
    }
    document.getElementById('readerOverlay').classList.remove('active');
    currentBook = null;
    currentPage = 0;
}

// 朗读整本书（从当前页开始）
async function ttsBook(bookId) {
    let book = bookLibrary.find(b => b.id === bookId);
    if (!book) return;
    if (!ttsConfig.apiKey) {
        alert('请先在设置中配置TTS API Key');
        return;
    }
    if (readerAudio) {
        readerAudio.pause();
        readerAudio = null;
        isReaderPlaying = false;
    }
    let startPos = book.progress;
    let textToRead = book.content.substring(startPos);
    if (!textToRead.trim()) {
        alert('本书已读完');
        return;
    }
    // 分段朗读，每段长度限制
    let chunkSize = 500;
    let chunks = [];
    for (let i = 0; i < textToRead.length; i += chunkSize) {
        chunks.push(textToRead.substring(i, i + chunkSize));
    }
    isReaderPlaying = true;
    for (let i = 0; i < chunks.length; i++) {
        if (!isReaderPlaying) break;
        await speakReaderChunk(chunks[i]);
        // 更新进度
        book.progress = startPos + (i + 1) * chunkSize;
        if (book.progress > book.content.length) book.progress = book.content.length;
        saveBookLibrary();
        renderBookList();
    }
    isReaderPlaying = false;
    alert('朗读完成');
}

async function speakReaderChunk(text) {
    if (!ttsConfig.apiKey) return;
    let cleanedText = cleanTextForTTS(text);
    let languageBoost = 'Chinese';
    try {
        let requestBody = {
            model: ttsConfig.model,
            text: cleanedText,
            stream: false,
            voice_setting: {
                voice_id: ttsConfig.voiceId,
                speed: ttsConfig.speed,
                vol: ttsConfig.vol,
                pitch: ttsConfig.pitch
            },
            audio_setting: {
                sample_rate: 32000,
                bitrate: 128000,
                format: ttsConfig.format,
                channel: 2
            },
            language_boost: languageBoost
        };
        const resp = await fetch('https://api.minimaxi.com/v1/t2a_v2', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ttsConfig.apiKey}` },
            body: JSON.stringify(requestBody)
        });
        if (!resp.ok) throw new Error(`TTS ${resp.status}`);
        const json = await resp.json();
        if (json.data && json.data.audio) {
            let hex = json.data.audio.replace(/\s/g, '');
            let byteArray = new Uint8Array(hex.length/2);
            for(let i=0; i<hex.length; i+=2) byteArray[i/2] = parseInt(hex.substr(i,2),16);
            let mime = ttsConfig.format === 'wav' ? 'audio/wav' : 'audio/mpeg';
            let blob = new Blob([byteArray], { type: mime });
            let url = URL.createObjectURL(blob);
            let audio = new Audio(url);
            readerAudio = audio;
            await new Promise((resolve) => {
                audio.onended = () => { URL.revokeObjectURL(url); resolve(); };
                audio.onerror = () => { URL.revokeObjectURL(url); resolve(); };
                audio.play();
            });
        }
    } catch(err) {
        console.error('Reader TTS error', err);
    }
}

// 导入TXT文件
function importTxtFile() {
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = '.txt';
    input.onchange = (e) => {
        let file = e.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = (event) => {
            let content = event.target.result;
            let title = file.name.replace(/\.txt$/i, '');
            addBook(title, content);
        };
        reader.readAsText(file, 'UTF-8');
    };
    input.click();
}
