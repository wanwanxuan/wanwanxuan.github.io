<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Push 通知演示</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --subtext: #6b7d8e;
            --primary: #0078d4;
            --primary-hover: #106ebe;
            --danger: #d13438;
            --success: #107c10;
            --warning: #ff8c00;
            --border: #e1e4e8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #e8edf5 0%, #f0f4f9 30%, #eaf0f8 60%, #f5f7fa 100%);
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 36px 32px 28px;
            box-shadow: var(--shadow), 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0078d4 0%, #00bcf2 100%);
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0, 120, 212, 0.3);
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 6px 20px rgba(0, 120, 212, 0.3);
            }
            50% {
                box-shadow: 0 6px 32px rgba(0, 120, 212, 0.55);
            }
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--subtext);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .status-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #ccc;
            transition: var(--transition);
            box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }
        .status-dot.active {
            background: #107c10;
            box-shadow: 0 0 0 8px rgba(16, 124, 16, 0.18);
            animation: dot-pulse 1.8s ease-in-out infinite;
        }
        .status-dot.denied {
            background: #d13438;
            box-shadow: 0 0 0 8px rgba(209, 52, 56, 0.15);
        }

        @keyframes dot-pulse {
            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(16, 124, 16, 0.25);
            }
            50% {
                box-shadow: 0 0 0 14px rgba(16, 124, 16, 0.06);
            }
        }

        .status-text {
            flex: 1;
        }
        .status-text strong {
            display: block;
            font-size: 0.95rem;
        }
        .status-text span {
            font-size: 0.8rem;
            color: var(--subtext);
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 120, 212, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            background: #a0c4e8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: #f0f6fc;
            transform: translateY(-1px);
        }
        .btn-outline:active {
            transform: scale(0.97);
        }

        .btn-danger {
            background: #fff;
            color: var(--danger);
            border: 2px solid #f5c6cb;
        }
        .btn-danger:hover {
            background: #fdf2f2;
            border-color: var(--danger);
        }

        .test-section {
            background: #fffdf5;
            border: 1px solid #ffe8b0;
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        .test-section h3 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .test-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .test-row input {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .test-row input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
        }
        .test-row .btn {
            flex: 0 0 auto;
            min-width: auto;
            padding: 10px 16px;
            font-size: 0.85rem;
        }

        .info-box {
            background: #f0f6fc;
            border: 1px solid #cce0f5;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 0.82rem;
            color: #3a5d7c;
            line-height: 1.6;
            margin-top: 12px;
        }
        .info-box svg {
            vertical-align: -3px;
            margin-right: 4px;
        }
        .info-box strong {
            color: #004c8c;
        }

        .log-area {
            background: #1e1e2e;
            color: #cdd6f4;
            border-radius: 10px;
            padding: 12px 16px;
            font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', 'Menlo', monospace;
            font-size: 0.78rem;
            max-height: 140px;
            overflow-y: auto;
            margin-top: 14px;
            line-height: 1.7;
        }
        .log-area .log-entry {
            border-bottom: 1px solid #313244;
            padding: 3px 0;
        }
        .log-area .log-entry:last-child {
            border-bottom: none;
        }
        .log-time {
            color: #89b4fa;
            margin-right: 8px;
        }
        .log-success {
            color: #a6e3a1;
        }
        .log-error {
            color: #f38ba8;
        }
        .log-info {
            color: #89dceb;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px 20px;
                border-radius: 16px;
            }
            .btn {
                font-size: 0.82rem;
                padding: 10px 12px;
            }
            .header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-5l4 2.5-4 2.5zm1-10c3.27 0 5.94 2.09 6.87 5h-2.05c-.76-1.86-2.53-3-4.82-3-2.3 0-4.07 1.14-4.83 3H5.13C6.06 6.09 8.73 4 12 4z"/></svg>
            </div>
            <h1>🔔 Web Push 通知</h1>
            <p>订阅后即使浏览器在后台，也能收到消息弹窗<br>支持 Edge / Chrome / 手机 PWA</p>
        </div>

        <!-- 状态指示 -->
        <div class="status-card" id="statusCard">
            <div class="status-dot" id="statusDot"></div>
            <div class="status-text">
                <strong id="statusTitle">检查中...</strong>
                <span id="statusDesc">正在检测通知权限</span>
            </div>
        </div>

        <!-- 按钮区 -->
        <div class="btn-row">
            <button class="btn btn-primary" id="btnSubscribe" disabled>
                🔔 订阅通知
            </button>
            <button class="btn btn-outline" id="btnUnsubscribe" disabled>
                🔕 取消订阅
            </button>
        </div>

        <!-- 测试推送区 -->
        <div class="test-section" id="testSection" style="display:none;">
            <h3>🧪 模拟新消息推送</h3>
            <div class="test-row">
                <input type="text" id="testTitle" value="📬 新消息提醒" placeholder="通知标题">
                <input type="text" id="testBody" value="您有1条新的私信，请查看！" placeholder="通知内容">
                <button class="btn btn-primary" id="btnTestLocal">📤 发送</button>
            </div>
            <p style="font-size:0.75rem;color:#8a6d3b;margin-top:6px;">
                ⚠️ 本地测试：点击后立即弹出通知（即使浏览器在后台也能看到）
            </p>
        </div>

        <!-- 信息提示 -->
        <div class="info-box" id="infoBox">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#0078d4"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13" stroke="white" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="white"/></svg>
            <strong>跨设备同步：</strong>在手机 Edge 打开本页面并订阅，即可在手机收到推送。安装为 PWA 后支持后台静默接收。
        </div>

        <!-- 日志 -->
        <div class="log-area" id="logArea">
            <div class="log-entry"><span class="log-time">--:--</span> <span class="log-info">等待初始化...</span></div>
        </div>
    </div>

    <script>
        // ==================== 工具函数 ====================
        const logArea = document.getElementById('logArea');

        function addLog(msg, type = 'info') {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', { hour12: false });
            const cssClass = type === 'success' ? 'log-success' : type === 'error' ? 'log-error' :
                'log-info';
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">${time}</span> <span class="${cssClass}">${msg}</span>`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
            // 保持最多30条
            while (logArea.children.length > 30) logArea.removeChild(logArea.firstChild);
        }

        // ==================== DOM元素 ====================
        const statusDot = document.getElementById('statusDot');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const btnSubscribe = document.getElementById('btnSubscribe');
        const btnUnsubscribe = document.getElementById('btnUnsubscribe');
        const testSection = document.getElementById('testSection');
        const btnTestLocal = document.getElementById('btnTestLocal');
        const testTitleInput = document.getElementById('testTitle');
        const testBodyInput = document.getElementById('testBody');
        const infoBox = document.getElementById('infoBox');

        // ==================== VAPID 公钥（仅用于演示） ====================
        // 实际生产环境中，你应该在后端生成VAPID密钥对，并将公钥传给前端
        // 这里使用一个示例公钥（仅用于本地测试，真实推送需配后端）
        const VAPID_PUBLIC_KEY =
            'BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Tksii8';

        // 将Base64 URL-safe转为Uint8Array
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        // ==================== Service Worker 注册 ====================
        async function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                throw new Error('浏览器不支持 Service Worker');
            }
            // 检查是否已有活跃的SW
            const existingReg = await navigator.serviceWorker.getRegistration();
            if (existingReg && existingReg.active) {
                addLog('✅ Service Worker 已就绪（复用现有）', 'success');
                return existingReg;
            }
            // 注册新的SW
            const registration = await navigator.serviceWorker.register('/sw.js', {
                scope: '/'
            });
            addLog('✅ Service Worker 注册成功', 'success');
            // 等待激活
            if (registration.installing) {
                await new Promise(resolve => {
                    registration.installing.addEventListener('statechange', function() {
                        if (this.state === 'activated') resolve();
                    });
                });
            }
            return registration;
        }

        // 动态创建 Service Worker 文件（通过Blob URL注入）
        async function ensureServiceWorker() {
            // 首先尝试直接注册 /sw.js（如果用户已在服务器部署了sw.js）
            try {
                const reg = await registerServiceWorker();
                return reg;
            } catch (e) {
                addLog('⚠️ 未找到 /sw.js，尝试动态注入...', 'info');
            }

            // 动态创建sw.js内容
            const swCode = `
            // ===== Web Push Service Worker =====
            self.addEventListener('push', function(event) {
              console.log('[SW] 收到推送事件:', event);
              let data = { title: '📬 新消息', body: '您有一条新的通知', icon: '/icon-192.png', badge: '/badge-72.png' };
              
              if (event.data) {
                try {
                  const payload = event.data.json();
                  data.title = payload.title || data.title;
                  data.body = payload.body || data.body;
                  if (payload.icon) data.icon = payload.icon;
                  if (payload.badge) data.badge = payload.badge;
                  if (payload.tag) data.tag = payload.tag;
                  if (payload.url) data.data = { url: payload.url };
                } catch(e) {
                  // 纯文本推送
                  data.body = event.data.text() || data.body;
                }
              }
              
              const options = {
                body: data.body,
                icon: data.icon,
                badge: data.badge,
                tag: data.tag || 'default',
                data: data.data || {},
                requireInteraction: false,
                vibrate: [200, 100, 200],
                actions: [
                  { action: 'open', title: '查看详情' },
                  { action: 'dismiss', title: '关闭' }
                ]
              };
              
              event.waitUntil(
                self.registration.showNotification(data.title, options)
              );
            });
            
            // 点击通知时打开对应页面
            self.addEventListener('notificationclick', function(event) {
              event.notification.close();
              const urlToOpen = event.notification.data?.url || '/';
              
              event.waitUntil(
                clients.matchAll({ type: 'window', includeUncontrolled: true }).then(function(clientList) {
                  // 如果已有打开的窗口，聚焦它
                  for (const client of clientList) {
                    if (client.url.includes(urlToOpen) && 'focus' in client) {
                      return client.focus();
                    }
                  }
                  // 否则打开新窗口
                  if (clients.openWindow) {
                    return clients.openWindow(urlToOpen);
                  }
                })
              );
            });
            
            // SW安装后立即激活
            self.addEventListener('install', function(event) {
              self.skipWaiting();
            });
            self.addEventListener('activate', function(event) {
              event.waitUntil(clients.claim());
            });
            
            console.log('[SW] ✅ Service Worker 已激活并准备接收推送');
          `;

            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);

            try {
                const registration = await navigator.serviceWorker.register(swUrl, { scope: '/' });
                addLog('✅ Service Worker 动态注入成功', 'success');
                // 等待激活
                if (registration.installing) {
                    await new Promise(resolve => {
                        registration.installing.addEventListener('statechange', function() {
                            if (this.state === 'activated') resolve();
                        });
                    });
                }
                // 清理Blob URL
                URL.revokeObjectURL(swUrl);
                return registration;
            } catch (err) {
                URL.revokeObjectURL(swUrl);
                throw err;
            }
        }

        // ==================== 推送订阅管理 ====================
        let currentSubscription = null;

        async function checkSubscriptionStatus() {
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                if (!registration) return null;
                const subscription = await registration.pushManager.getSubscription();
                currentSubscription = subscription;
                return subscription;
            } catch (e) {
                return null;
            }
        }

        async function updateUI() {
            const permission = Notification.permission;
            const subscription = await checkSubscriptionStatus();

            // 更新状态点
            statusDot.className = 'status-dot';
            btnSubscribe.disabled = false;
            btnUnsubscribe.disabled = true;
            testSection.style.display = 'none';

            if (permission === 'denied') {
                statusDot.classList.add('denied');
                statusTitle.textContent = '❌ 通知已阻止';
                statusDesc.textContent = '请在浏览器设置中允许本站通知';
                btnSubscribe.disabled = true;
                btnUnsubscribe.disabled = true;
                infoBox.innerHTML =
                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="#d13438"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13" stroke="white" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="white"/></svg> <strong>通知被阻止：</strong>请点击地址栏左侧的锁图标 → 通知 → 设为"允许"';
            } else if (subscription) {
                statusDot.classList.add('active');
                statusTitle.textContent = '✅ 已订阅推送通知';
                statusDesc.textContent = '浏览器后台运行时也能收到消息弹窗';
                btnSubscribe.disabled = true;
                btnUnsubscribe.disabled = false;
                testSection.style.display = 'block';
                infoBox.innerHTML =
                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="#107c10"><circle cx="12" cy="12" r="10"/><polyline points="8,12 11,15 16,9" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> <strong>已连接！</strong>在手机Edge打开本页面并订阅，即可实现跨设备消息推送。';
            } else if (permission === 'default') {
                statusTitle.textContent = 'ℹ️ 尚未订阅';
                statusDesc.textContent = '点击下方按钮开启通知（需要授权）';
            } else {
                statusTitle.textContent = 'ℹ️ 准备就绪';
                statusDesc.textContent = '点击订阅以接收推送通知';
            }
        }

        // ==================== 订阅 ====================
        async function subscribeToPush() {
            try {
                addLog('📡 正在请求通知权限...', 'info');
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    throw new Error('用户拒绝了通知权限');
                }
                addLog('✅ 通知权限已授予', 'success');

                // 确保Service Worker就绪
                const registration = await ensureServiceWorker();
                addLog('🔧 正在生成推送订阅...', 'info');

                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
                });

                currentSubscription = subscription;
                addLog('✅ 推送订阅成功！', 'success');

                // 输出订阅信息（实际应用中应发送到后端服务器存储）
                const subData = subscription.toJSON();
                console.log('📋 推送订阅信息（需发送到后端）:', JSON.stringify(subData, null, 2));
                addLog('📋 端点: ' + subData.endpoint.substring(0, 50) + '...', 'info');
                addLog('🔑 P256DH密钥: ' + subData.keys.p256dh.substring(0, 20) + '...', 'info');

                // 模拟：将订阅信息存储到localStorage（实际应POST到后端）
                localStorage.setItem('pushSubscription', JSON.stringify(subData));
                addLog('💾 订阅信息已本地暂存（生产环境需发送到服务器）', 'info');

                await updateUI();
            } catch (err) {
                addLog('❌ 订阅失败: ' + err.message, 'error');
                console.error('订阅详细错误:', err);
                await updateUI();
            }
        }

        // ==================== 取消订阅 ====================
        async function unsubscribeFromPush() {
            try {
                const subscription = await checkSubscriptionStatus();
                if (subscription) {
                    await subscription.unsubscribe();
                    addLog('🔕 已取消推送订阅', 'success');
                }
                localStorage.removeItem('pushSubscription');
                currentSubscription = null;
                await updateUI();
            } catch (err) {
                addLog('❌ 取消订阅失败: ' + err.message, 'error');
            }
        }

        // ==================== 本地测试推送 ====================
        function triggerLocalNotification(title, body) {
            if (Notification.permission !== 'granted') {
                addLog('❌ 无通知权限，无法发送', 'error');
                return;
            }
            // 方法1：通过Service Worker发送（模拟真实推送）
            navigator.serviceWorker.ready.then(registration => {
                // 检查是否已有订阅（真实推送需要）
                registration.pushManager.getSubscription().then(sub => {
                    if (sub) {
                        // 有订阅：通过showNotification模拟（实际应由后端通过Push Service发送）
                        registration.showNotification(title, {
                            body: body,
                            icon: '/icon-192.png',
                            badge: '/badge-72.png',
                            tag: 'test-' + Date.now(),
                            vibrate: [200, 100, 200],
                            requireInteraction: false,
                            data: { url: window.location.href },
                            actions: [
                                { action: 'open', title: '查看详情' },
                                { action: 'dismiss', title: '关闭' }
                            ],
                        });
                        addLog(`📤 通知已发送: "${title}"`, 'success');
                    } else {
                        // 无订阅时直接用Notification API
                        new Notification(title, { body, icon: '/icon-192.png' });
                        addLog(`📤 通知已发送(直接): "${title}"`, 'success');
                    }
                });
            });
        }

        // ==================== 事件绑定 ====================
        btnSubscribe.addEventListener('click', subscribeToPush);
        btnUnsubscribe.addEventListener('click', unsubscribeFromPush);

        btnTestLocal.addEventListener('click', () => {
            const title = testTitleInput.value.trim() || '📬 新消息提醒';
            const body = testBodyInput.value.trim() || '您有一条新的消息';
            triggerLocalNotification(title, body);
        });

        // 监听权限变化（用户在浏览器设置中修改权限后自动更新UI）
        if ('permissions' in navigator) {
            navigator.permissions.query({ name: 'notifications' }).then(permStatus => {
                permStatus.addEventListener('change', () => {
                    addLog('🔄 通知权限状态已变更', 'info');
                    updateUI();
                });
            });
        }

        // 监听Service Worker消息
        navigator.serviceWorker.addEventListener('message', event => {
            if (event.data && event.data.type === 'push-received') {
                addLog('📩 收到后台推送: ' + (event.data.title || '新消息'), 'success');
            }
        });

        // ==================== 初始化 ====================
        async function init() {
            addLog('🚀 初始化 Web Push 系统...', 'info');

            // 检查浏览器支持
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                addLog('❌ 浏览器不支持Web Push', 'error');
                statusTitle.textContent = '❌ 浏览器不支持';
                statusDesc.textContent = '请使用 Edge / Chrome / Firefox 等现代浏览器';
                btnSubscribe.disabled = true;
                btnUnsubscribe.disabled = true;
                return;
            }

            if (!('Notification' in window)) {
                addLog('❌ 浏览器不支持 Notification API', 'error');
                return;
            }

            // 尝试注册Service Worker
            try {
                await ensureServiceWorker();
            } catch (err) {
                addLog('⚠️ SW注册失败: ' + err.message + '（本地测试通知仍可用）', 'error');
            }

            // 恢复之前的订阅状态
            const savedSub = localStorage.getItem('pushSubscription');
            if (savedSub && Notification.permission === 'granted') {
                addLog('📋 检测到之前的订阅记录', 'info');
                // 尝试恢复（实际上需要重新订阅或验证）
                const currentSub = await checkSubscriptionStatus();
                if (!currentSub) {
                    addLog('⚠️ 之前的订阅已失效，需要重新订阅', 'info');
                    localStorage.removeItem('pushSubscription');
                }
            }

            await updateUI();
            addLog('✅ 初始化完成', 'success');

            // 输出VAPID公钥提示
            console.log('%c🔑 VAPID公钥（演示用）:%c ' + VAPID_PUBLIC_KEY,
                'color:#0078d4;font-weight:bold', 'color:#666');
            console.log('%c📌 生产环境请在后端生成VAPID密钥对，并将公钥传给前端',
                'color:#ff8c00;font-size:14px');
            console.log('%c👉 后端生成工具: https://web-push-codelab.glitch.me/',
                'color:#107c10');
        }

        init();
    </script>
</body>
</html>
